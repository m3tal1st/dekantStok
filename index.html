<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dekant Medya | Enterprise Stok Yönetimi</title>
    <!-- Modern ve Kurumsal Fontlar -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #fdf2f2; /* Soft red tint */
            --bg-card: #ffffff;
            --primary: #dc2626; /* Crimson Red */
            --primary-hover: #b91c1c;
            --primary-light: #fef2f2;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 28px;
            --shadow-md: 0 10px 20px -3px rgba(220, 38, 38, 0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
            --shadow-lg: 0 25px 35px -5px rgba(220, 38, 38, 0.12), 0 10px 15px -6px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; }

        body { background-color: var(--bg-body); color: var(--text-dark); padding: 25px 40px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased;}

        /* --- DEVASA KURUMSAL HEADER --- */
        .header {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg-card); padding: 45px 20px 35px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md); margin-bottom: 30px; border-bottom: 6px solid var(--primary);
            flex-shrink: 0; position: relative;
        }
        
        .brand-title { 
            font-size: 72px; font-weight: 900; letter-spacing: -2px;
            background: linear-gradient(135deg, #450a0a 0%, #dc2626 50%, #ef4444 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; line-height: 1; text-shadow: 0 15px 35px rgba(220, 38, 38, 0.15);
            margin-bottom: 5px;
        }
        .brand-subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; color: var(--text-muted); letter-spacing: 5px; text-transform: uppercase; margin-top: 5px;}

        .settings-btn {
            position: absolute; right: 40px; top: 40px; padding: 16px 28px; background: #f8fafc;
            color: var(--text-dark); font-weight: 800; font-size: 16px; border: none; border-radius: var(--radius-sm);
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border);
        }
        .settings-btn:hover { background: var(--primary-light); color: var(--primary); transform: translateY(-3px); box-shadow: 0 6px 12px rgba(220, 38, 38, 0.15); border-color: var(--primary); }

        /* --- BÜYÜTÜLMÜŞ TABS --- */
        .tabs-wrapper { display: flex; justify-content: center; width: 100%; margin-top: 35px; }
        .tabs-container {
            display: inline-flex; gap: 15px; background: var(--bg-card); padding: 12px;
            border-radius: 60px; border: 2px solid var(--border); box-shadow: var(--shadow-md);
            overflow-x: auto; scrollbar-width: none; max-width: 100%;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn {
            padding: 20px 45px; font-size: 20px; font-weight: 900; border: none; border-radius: 50px;
            cursor: pointer; background: transparent; color: var(--text-muted); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap; font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 1px;
        }
        .tab-btn:hover { color: var(--text-dark); }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(220, 38, 38, 0.4); transform: scale(1.03);}

        /* --- ACTION BUTTONS --- */
        .top-buttons { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; flex-shrink: 0;}
        .btn-top { padding: 18px 36px; font-size: 18px; font-weight: 800; border: none; border-radius: 16px; cursor: pointer; transition: 0.2s; color: white; display: flex; align-items: center; gap: 10px; font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0.5px;}
        .btn-action { background-color: var(--primary); box-shadow: 0 8px 25px rgba(220, 38, 38, 0.35); }
        .btn-action:hover { background-color: var(--primary-hover); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(220, 38, 38, 0.45);}
        .btn-history { background-color: var(--text-dark); box-shadow: 0 8px 25px rgba(15, 23, 42, 0.3); }
        .btn-history:hover { background-color: #000; transform: translateY(-4px); }

        /* --- DASHBOARD GRID --- */
        .dashboard-wrapper { flex: 1; overflow-y: auto; padding-bottom: 40px; padding-top: 5px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; }
        .stock-card {
            background: var(--bg-card); border-radius: var(--radius-lg); padding: 40px 35px; cursor: pointer;
            box-shadow: var(--shadow-md); border: 2px solid var(--border); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .stock-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: var(--primary); }
        .stock-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .card-title { font-size: 22px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'Plus Jakarta Sans', sans-serif;}
        .card-amount { font-size: 72px; font-weight: 900; color: var(--text-dark); margin: 20px 0; line-height: 1; }
        .card-hint { font-size: 16px; color: var(--primary); font-weight: 800; margin-top: auto; display: flex; align-items: center; gap: 8px;}

        /* --- MODALS GENERAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(69, 10, 10, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); padding: 20px; }
        .modal { background: var(--bg-card); width: 100%; max-width: 750px; border-radius: var(--radius-lg); padding: 45px; box-shadow: var(--shadow-lg); position: relative; max-height: 95vh; overflow-y: auto; display: flex; flex-direction: column; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .close-btn { position: absolute; top: 30px; right: 35px; font-size: 36px; font-weight: 300; cursor: pointer; color: var(--text-muted); background: var(--bg-body); border: none; width: 55px; height: 55px; border-radius: 50%; display:flex; align-items:center; justify-content:center; transition:0.2s;}
        .close-btn:hover { color: var(--danger); background: #fee2e2; transform: rotate(90deg);}
        .modal h2 { font-size: 32px; font-weight: 900; border-bottom: 3px solid var(--bg-body); padding-bottom: 20px; margin-bottom: 35px; color: var(--text-dark); font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -1px;}

        /* --- FORMS & VALIDATION --- */
        .form-label { display: block; font-weight: 900; font-size: 15px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px;}
        .custom-select { width: 100%; padding: 20px; font-size: 18px; border-radius: 16px; appearance: none; outline: none; margin-bottom: 25px; cursor: pointer; transition: 0.3s; font-family: 'Outfit', sans-serif;}
        
        .custom-select.empty-field {
            border: 3px dashed #fca5a5; background-color: var(--primary-light); color: #b91c1c; font-weight: 700;
        }
        .custom-select.filled-field, .dyn-new-input.filled-field, .note-input.filled-field {
            border: 3px solid var(--success); background-color: #fff; color: var(--text-dark); font-weight: 900; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.1);
        }

        .dyn-new-input {
            width: 100%; padding: 20px; font-size: 18px; font-weight: 800; color: var(--text-dark);
            border: 3px dashed #fca5a5; border-radius: 16px; outline: none; margin-bottom: 25px; margin-top: -15px;
            display: none; background: var(--primary-light); transition: 0.3s;
        }

        .note-input {
            width: 100%; padding: 20px; font-size: 17px; font-weight: 600; color: var(--text-dark);
            border: 2px solid var(--border); border-radius: 16px; outline: none; margin-bottom: 25px; background: #fff; transition: 0.3s;
        }
        .note-input:focus { border-color: var(--primary); }

        .qty-wrapper { display: flex; align-items: center; gap: 15px; margin-bottom: 35px;}
        .qty-btn { width: 65px; height: 65px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid var(--border); border-radius: 18px; cursor: pointer; color: var(--text-dark); transition:0.2s;}
        .qty-btn:hover { background: var(--bg-body); border-color: var(--primary); color: var(--primary);}
        .qty-input { width: 140px; height: 65px; font-size: 30px; font-weight: 900; text-align: center; border: 3px solid var(--success); border-radius: 18px; outline: none; background: #fff; color: var(--success);}

        .action-btn-group { display: flex; gap: 20px; }
        .btn-action-in { flex: 1; padding: 25px; font-size: 20px; font-weight: 900; background: var(--success); color: white; border: none; border-radius: 18px; cursor: pointer; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35); transition: 0.2s;}
        .btn-action-out { flex: 1; padding: 25px; font-size: 20px; font-weight: 900; background: var(--danger); color: white; border: none; border-radius: 18px; cursor: pointer; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.35); transition: 0.2s;}
        .btn-action-in:hover, .btn-action-out:hover { transform: translateY(-5px); opacity: 0.95;}

        /* --- SETTINGS / BUILDER MODAL (ADVANCED EDIT) --- */
        .builder-section { background: var(--bg-card); border-radius: var(--radius-md); padding: 30px; margin-bottom: 30px; border: 2px solid var(--border); box-shadow: var(--shadow-sm);}
        .builder-section h3 { font-size: 20px; font-weight: 900; color: var(--primary); margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center;}
        .input-group { display: flex; gap: 12px; margin-bottom: 15px; }
        .input-group input, .input-group select { flex: 1; padding: 18px; border: 2px solid var(--border); border-radius: 14px; font-size: 17px; font-weight: 700; outline: none; background: #fff; transition: 0.2s;}
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light);}
        .btn-add { padding: 18px 28px; background: var(--text-dark); color: white; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size:16px;}
        .btn-add:hover { background: #000; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
        
        .pill-container { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .pill { background: #fff; border: 2px solid var(--border); padding: 8px 16px; border-radius: 40px; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm);}
        .pill-actions { display: flex; gap: 6px; align-items: center; border-left: 2px solid var(--border); padding-left: 10px; margin-left: 5px;}
        .pill-action-btn { background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.6; transition: 0.2s; display: flex; align-items: center; justify-content: center;}
        .pill-action-btn:hover { opacity: 1; transform: scale(1.2); }
        .pill-action-btn.edit { color: var(--primary); }
        .pill-action-btn.delete { color: var(--danger); font-size: 20px; font-weight: 900;}

        .attr-builder-box { background: #fff; border: 3px dashed var(--border); border-radius: 16px; padding: 25px; margin-bottom: 20px; position:relative;}
        .attr-title-input { font-size: 18px; font-weight: 900; color: var(--text-dark); border: none; border-bottom: 2px dashed var(--border); outline: none; padding: 5px; margin-bottom: 15px; width: 80%; background: transparent; transition: 0.2s;}
        .attr-title-input:focus { border-bottom-color: var(--primary); }
        .btn-remove-attr { position: absolute; top: 20px; right: 20px; background: #fee2e2; color: var(--danger); border: none; width: 35px; height: 35px; border-radius: 10px; font-size:18px; font-weight: 900; cursor: pointer; transition:0.2s;}
        .btn-remove-attr:hover { transform:scale(1.1); }
        
        .btn-save-master { width: 100%; padding: 24px; font-size: 20px; font-weight: 900; background: var(--success); color: white; border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35); transition: 0.2s; margin-top: 15px;}
        .btn-save-master:hover { transform: translateY(-4px); background: #059669; }
        .btn-delete-master { width: 100%; padding: 20px; font-size: 18px; font-weight: 900; background: #fff; color: var(--danger); border: 2px solid var(--danger); border-radius: 16px; cursor: pointer; transition: 0.2s; margin-top: 15px;}
        .btn-delete-master:hover { background: var(--danger); color: white; }

        /* --- TABLES --- */
        .table-container { overflow-x: auto; border-radius: 18px; border: 2px solid var(--border); background: #fff;}
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: var(--bg-body); padding: 22px; font-size: 15px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; text-align: left; border-bottom: 3px solid var(--border); letter-spacing: 0.5px;}
        td { padding: 22px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: 700; vertical-align: middle; color: var(--text-dark);}
        tbody tr:hover { background: var(--primary-light); }
        
        .status-badge { padding: 10px 18px; border-radius: 30px; font-size: 14px; font-weight: 900; text-transform: uppercase; font-family: 'Plus Jakarta Sans', sans-serif;}
        .status-in { color: var(--success); background: #d1fae5; }
        .status-out { color: var(--danger); background: #fee2e2; }

        .quick-action-cell { display: flex; align-items: center; gap: 12px; justify-content: flex-start;}
        .quick-btn { padding: 14px 22px; font-size: 16px; font-weight: 900; color: white; border: none; border-radius: 14px; cursor: pointer; transition: 0.2s; text-transform: uppercase;}
        .quick-btn.out { background-color: var(--danger); }
        .quick-btn.in { background-color: var(--success); }
        .quick-btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-md);}
        
        .row-qty-control { display: flex; border: 2px solid var(--border); border-radius: 14px; overflow: hidden; height: 50px; background: #fff;}
        .row-qty-btn { width: 45px; background: var(--bg-body); border: none; font-size: 24px; font-weight: bold; cursor: pointer; transition:0.2s;}
        .row-qty-btn:hover { background: #e2e8f0; }
        .row-qty-input { width: 60px; text-align: center; font-size: 20px; font-weight: 900; border: none; border-left: 2px solid var(--border); border-right: 2px solid var(--border); outline: none; }
        
        .row-note-input { width: 100%; min-width: 140px; padding: 14px; font-size: 15px; font-weight: 600; border: 2px solid var(--border); border-radius: 12px; outline: none; background: var(--bg-body); transition: 0.2s;}
        .row-note-input:focus { border-color: var(--primary); background: #fff; }

        /* --- BIG CONFIRM BOX --- */
        .confirm-box { text-align: center; font-size: 26px; line-height: 1.8; color: var(--text-dark); padding: 30px 10px; font-weight: 600;}
        .highlight { font-size: 30px; font-weight: 900; color: var(--primary); text-transform: uppercase; padding: 6px 14px; background: var(--primary-light); border-radius: 12px; display: inline-block; margin: 4px 0;}
        .highlight.danger { color: var(--danger); background: #fee2e2; }
        .highlight.success { color: var(--success); background: #d1fae5; }

        .empty-state { text-align: center; padding: 100px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 90px; margin-bottom: 25px; opacity: 0.8;}
        .empty-state-text { font-size: 24px; font-weight: 900; margin-bottom: 35px; color: var(--text-dark);}

        @media (max-width: 900px) {
            .brand-title { font-size: 42px; }
            .settings-btn { position: relative; right: auto; top: auto; width: 100%; justify-content: center; margin-top: 20px;}
            .tabs-wrapper { justify-content: flex-start; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .input-group { flex-direction: column; }
            .action-btn-group { flex-direction: column; }
            .tab-btn { padding: 14px 28px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- DEVASA HEADER -->
    <div class="header">
        <h1 class="brand-title">Dekant Medya</h1>
        <h2 class="brand-subtitle">Profesyonel Stok Yönetimi</h2>
        <button class="settings-btn" onclick="openModal('settingsModal')">⚙️ Sistem & Ayarlar</button>
        
        <div class="tabs-wrapper">
            <div class="tabs-container" id="tabsContainer"></div>
        </div>
    </div>

    <!-- ANA BUTONLAR -->
    <div class="top-buttons">
        <button class="btn-top btn-action" onclick="openActionModal()">📦 Yeni İşlem Oluştur</button>
        <button class="btn-top btn-history" onclick="openModal('historyModal')">⏱️ Hareket Geçmişi</button>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard-wrapper">
        <div class="dashboard-grid" id="dashboardContainer"></div>
    </div>

    <!-- MODAL 1: SİSTEM AYARLARI -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal" style="max-width: 900px;">
            <button class="close-btn" onclick="closeModal('settingsModal')">&times;</button>
            <h2>⚙️ Sistem Kurulumu & Ayarlar</h2>
            
            <div class="builder-section">
                <h3>1. Personel Yönetimi</h3>
                <div class="input-group">
                    <input type="text" id="newUserInput" placeholder="Yeni personel adı yazın...">
                    <button class="btn-add" onclick="addSimpleItem('users', 'newUserInput')">Personel Ekle</button>
                </div>
                <div class="pill-container" id="settingsUsersList"></div>
            </div>

            <div class="builder-section">
                <h3>2. Bölüm (Departman) Yönetimi</h3>
                <div class="input-group">
                    <input type="text" id="newDepInput" placeholder="Örn: Baskı, Plotter, Depo...">
                    <button class="btn-add" onclick="addSimpleItem('departments', 'newDepInput')">Bölüm Ekle</button>
                </div>
                <div class="pill-container" id="settingsDepsList"></div>
            </div>

            <!-- ÜRÜN YÖNETİCİSİ -->
            <div class="builder-section" style="border-color: var(--primary); background: #fff; box-shadow: var(--shadow-md);">
                <h3>3. Ürün Yöneticisi <span style="font-size:14px; color:var(--text-muted); font-weight:700;">(Ekle / Düzenle / Sil)</span></h3>
                
                <select id="builderMatSelect" class="custom-select" style="margin-bottom: 20px; border-width: 3px;" onchange="loadMaterialForEdit()">
                    <option value="new">✨ SIFIRDAN YENİ ÜRÜN YARAT</option>
                </select>

                <div class="input-group">
                    <select id="builderDepSelect" class="custom-select" style="margin-bottom:0; padding:18px;"><option value="">-- Hangi Bölüme Ait? --</option></select>
                    <input type="text" id="builderMatName" placeholder="Malzeme Adı (Örn: Çift Taraflı Bant)">
                </div>

                <div style="background: var(--bg-body); padding: 25px; border-radius: 16px; margin-top: 20px; border: 1px solid var(--border);">
                    <h4 style="margin-bottom: 15px; font-weight:900; font-size:16px; color:var(--text-dark);">🏷️ Malzemeye Ait Alt Nitelikler (Opsiyonel)</h4>
                    <div class="input-group">
                        <input type="text" id="builderAttrName" placeholder="Nitelik Başlığı (Örn: Renk, Kalınlık, Kulp Tipi)">
                        <button class="btn-add" style="background:var(--primary);" onclick="addTempAttribute()">Başlık Ekle</button>
                    </div>
                    <div id="builderAttrContainer"></div>
                </div>

                <button id="btnSaveMat" class="btn-save-master" onclick="saveNewMaterial()">✅ MALZEMEYİ VERİTABANINA KAYDET</button>
                <button id="btnDeleteMat" class="btn-delete-master" style="display:none;" onclick="deleteMaterial()">🗑️ BU MALZEMEYİ TAMAMEN SİL</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: YENİ İŞLEM -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('actionModal')">&times;</button>
            <h2 id="actionModalTitle">📦 Yeni İşlem</h2>
            
            <label class="form-label">1. İşlemi Yapan Personel</label>
            <select id="actionUserSelect" class="custom-select empty-field" onchange="validateField(this)"></select>

            <label class="form-label">2. Malzeme Seçimi</label>
            <select id="actionMatSelect" class="custom-select empty-field" onchange="validateField(this); renderActionAttributes();"></select>

            <div id="actionDynamicArea"></div>

            <label class="form-label" style="margin-top: 15px;">İŞLEM NOTU / DETAY (OPSİYONEL)</label>
            <input type="text" id="actionNote" class="note-input" placeholder="Örn: 3. rafta, defolu, acil..." oninput="validateNoteField(this)">

            <label class="form-label" style="margin-top: 10px;">İŞLEM MİKTARI / BİRİM</label>
            <div class="qty-wrapper">
                <button class="qty-btn" onclick="changeQty('actionQty', -1)">-</button>
                <input type="number" id="actionQty" class="qty-input" value="1" min="1">
                <button class="qty-btn" onclick="changeQty('actionQty', 1)">+</button>
            </div>

            <div class="action-btn-group">
                <button class="btn-action-in" onclick="processTransaction('in')">⬇️ STOĞA EKLE</button>
                <button class="btn-action-out" onclick="processTransaction('out')">⬆️ STOKTAN DÜŞ</button>
            </div>
        </div>
    </div>

    <!-- MODAL 3: DETAYLI STOK -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" style="max-width: 1400px;">
            <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 35px; padding-right: 70px;">
                <h2 id="detailModalTitle" style="margin:0; padding:0; border:none; color:var(--primary); font-size:36px;">Detay</h2>
                <button class="btn-top btn-action" style="padding:16px 28px; font-size:16px;" onclick="jumpToActionModal()">➕ İşlem Ekle</button>
            </div>

            <div id="quickUserContainer" style="background:#fff; padding:30px; border-radius:20px; border:2px dashed var(--primary); margin-bottom:30px; display:none; box-shadow:var(--shadow-sm);">
                <label class="form-label" style="margin-bottom:12px; font-size:16px; color:var(--primary);">Hızlı İşlem Yapacak Personel (Zorunlu):</label>
                <select id="quickUserSelect" class="custom-select empty-field" style="margin:0; padding:22px; font-size:18px;" onchange="validateField(this)"></select>
            </div>

            <div class="table-container" id="detailTableContainer" style="box-shadow: var(--shadow-lg); border:none;">
                <table id="detailTable">
                    <thead id="detailTableHead"></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL 4: GEÇMİŞ -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal" style="max-width: 1200px;">
            <button class="close-btn" onclick="closeModal('historyModal')">&times;</button>
            <h2>⏱️ Hareket Geçmişi</h2>
            
            <div style="display:flex; gap:20px; margin-bottom:30px; flex-wrap:wrap;">
                <select id="logDateFilter" onchange="filterLogs()" class="custom-select" style="flex:1; min-width:150px; margin:0; padding:18px;">
                    <option value="all">Tüm Zamanlar</option>
                    <option value="today">Bugün</option>
                    <option value="month">Bu Ay</option>
                    <option value="year">Bu Yıl</option>
                </select>
                <input type="date" id="logCustomDate" onchange="filterLogs()" class="custom-select" style="flex:1; min-width:150px; margin:0; padding:18px; font-family:'Plus Jakarta Sans'; font-weight:700;">
                <input type="text" id="logSearchInput" placeholder="Personel veya malzeme ara..." onkeyup="filterLogs()" class="custom-select" style="flex:2; min-width:200px; margin:0; background:#fff; padding:18px;">
            </div>

            <div class="table-container">
                <table id="logTable">
                    <thead><tr><th>Tarih</th><th>Personel</th><th>Detay</th><th>Not / Detay</th><th style="text-align:right;">Durum</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL 5: ONAY -->
    <div class="modal-overlay" id="confirmModal" style="z-index: 2000;">
        <div class="modal" style="max-width: 850px; padding: 60px;">
            <div class="confirm-box" id="confirmText"></div>
            <div style="display: flex; gap: 25px; margin-top: 50px;">
                <button onclick="closeModal('confirmModal')" style="flex:1; padding:26px; border-radius:18px; border:none; cursor:pointer; background:var(--border); color:var(--text-dark); font-weight:900; font-size:22px; transition:0.2s;">İPTAL ET</button>
                <button id="executeBtn" style="flex:1; padding:26px; border-radius:18px; border:none; cursor:pointer; background:var(--primary); color:white; font-weight:900; font-size:22px; box-shadow: 0 10px 25px rgba(220,38,38,0.4); transition:0.2s;">EVET, ONAYLIYORUM</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKr3S4Yiz9raVzQxUXp0sLg9S69MwIZN4",
            authDomain: "dekastok-6a3a5.firebaseapp.com",
            databaseURL: "https://dekastok-6a3a5-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "dekastok-6a3a5",
            storageBucket: "dekastok-6a3a5.firebasestorage.app",
            messagingSenderId: "840760282090",
            appId: "1:840760282090:web:4ffd9e3345aa1e4ea38093"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GLOBAL DEĞİŞKENLER (v15 YENİ YAPI) ---
        let dbData = { users: {}, departments: {}, materials: {} };
        let dbStock = {};
        let dbLogs = [];
        let activeTabId = null;
        let editingMatId = null; 
        let tempAttributes = []; 
        let pendingTx = null; 
        let currentDetailMatId = null; 

        // --- VERİTABANI DİNLEME ---
        onValue(ref(db, 'db_v15/config'), (snapshot) => {
            if (snapshot.exists()) {
                dbData = snapshot.val();
                if(!dbData.users) dbData.users = {};
                if(!dbData.departments) dbData.departments = {};
                if(!dbData.materials) dbData.materials = {};
            } else {
                dbData = { users: {}, departments: {}, materials: {} };
            }
            renderUI();
        });

        onValue(ref(db, 'db_v15/stock'), (snapshot) => { 
            dbStock = snapshot.val() || {}; 
            renderDashboard();
            if(document.getElementById('detailModal').style.display === 'flex' && currentDetailMatId) {
                renderDetailModal(currentDetailMatId);
            }
        });

        onValue(ref(db, 'db_v15/logs'), (snapshot) => { 
            const data = snapshot.val() || {}; 
            dbLogs = Object.values(data).reverse(); 
            if(document.getElementById('historyModal').style.display === 'flex') filterLogs(); 
        });

        // --- GÖRSEL DOĞRULAMA (VALIDATION) ---
        window.validateField = function(el) {
            if(!el) return;
            if(el.value.trim() === "" || el.value === "__NEW__") {
                el.classList.add('empty-field'); el.classList.remove('filled-field');
            } else {
                el.classList.add('filled-field'); el.classList.remove('empty-field');
            }
        };

        window.validateNewInput = function(el) {
            if(el.value.trim() !== "") {
                el.classList.add('filled-field'); el.classList.remove('empty-field');
            } else {
                el.classList.add('empty-field'); el.classList.remove('filled-field');
            }
        };

        window.validateNoteField = function(el) {
            if(el.value.trim() !== "") { el.classList.add('filled-field'); } 
            else { el.classList.remove('filled-field'); }
        };

        // --- UI RENDER (TABS & DASHBOARD) ---
        function renderUI() {
            renderTabs();
            renderSettingsData();
            
            if(document.getElementById('actionModal').style.display === 'flex') {
                const mSel = document.getElementById('actionMatSelect');
                const oldVal = mSel.value;
                mSel.innerHTML = '<option value="">-- Malzeme Seçin --</option>';
                Object.entries(dbData.materials).filter(([_, m]) => m.depId === activeTabId).forEach(([id, m]) => {
                    mSel.innerHTML += `<option value="${id}">${m.name.toUpperCase()}</option>`;
                });
                if(dbData.materials[oldVal]) {
                    mSel.value = oldVal;
                    validateField(mSel);
                }
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';
            const deps = Object.entries(dbData.departments);
            
            if (deps.length === 0) {
                tabsContainer.innerHTML = `<span style="padding:20px; color:var(--text-muted); font-weight:800; font-size:18px;">Lütfen Ayarlardan Bölüm Ekleyin.</span>`;
                document.getElementById('dashboardContainer').innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">⚙️</div>
                        <div class="empty-state-text">Sistem henüz kurulmadı.</div>
                        <button class="btn-top btn-action" style="margin: 0 auto;" onclick="openModal('settingsModal')">Hemen Kuruluma Başla</button>
                    </div>`;
                return;
            }

            if(!activeTabId || !dbData.departments[activeTabId]) activeTabId = deps[0][0];

            deps.forEach(([id, name]) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${id === activeTabId ? 'active' : ''}`;
                btn.innerText = name.toUpperCase();
                btn.onclick = () => { activeTabId = id; renderTabs(); renderDashboard(); };
                tabsContainer.appendChild(btn);
            });
            renderDashboard();
        }

        window.renderDashboard = function() {
            if(!activeTabId || !dbData.departments[activeTabId]) return;
            const container = document.getElementById('dashboardContainer');
            container.innerHTML = '';

            const materials = Object.entries(dbData.materials).filter(([_, mat]) => mat.depId === activeTabId);

            if (materials.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">📦</div>
                        <div class="empty-state-text">Bu bölümde henüz malzeme yok.</div>
                        <button class="btn-top btn-action" style="margin: 0 auto; background:var(--text-dark);" onclick="openModal('settingsModal')">Yeni Malzeme Yarat</button>
                    </div>`;
                return;
            }

            materials.forEach(([matId, mat]) => {
                let total = 0;
                if (dbStock[matId]) { 
                    Object.values(dbStock[matId]).forEach(obj => { total += (obj.qty || 0); }); 
                }
                container.innerHTML += `
                    <div class="stock-card" onclick="openDetailModal('${matId}')">
                        <div class="card-title">${mat.name}</div>
                        <div class="card-amount">${total}</div>
                        <div class="card-hint">
                            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Detayları & Stokları Yönet
                        </div>
                    </div>
                `;
            });
        };

        // --- SİSTEM AYARLARI (GELİŞMİŞ DÜZENLEME MİMARİSİ) ---
        window.renderSettingsData = function() {
            const uCont = document.getElementById('settingsUsersList');
            uCont.innerHTML = '';
            Object.entries(dbData.users).forEach(([id, name]) => {
                uCont.innerHTML += `
                <div class="pill">${name} 
                    <div class="pill-actions">
                        <button class="pill-action-btn edit" onclick="editSimpleItem('users', '${id}', '${name}')">✏️</button>
                        <button class="pill-action-btn delete" onclick="deleteDbNode('config/users/${id}')">&times;</button>
                    </div>
                </div>`;
            });

            const dCont = document.getElementById('settingsDepsList');
            const dSelect = document.getElementById('builderDepSelect');
            const currentDepVal = dSelect.value;
            
            dCont.innerHTML = ''; 
            dSelect.innerHTML = '<option value="">-- Hangi Bölüme Ait? --</option>';
            Object.entries(dbData.departments).forEach(([id, name]) => {
                dCont.innerHTML += `
                <div class="pill" style="border-color:var(--primary);">${name} 
                    <div class="pill-actions">
                        <button class="pill-action-btn edit" onclick="editSimpleItem('departments', '${id}', '${name}')">✏️</button>
                        <button class="pill-action-btn delete" onclick="deleteDbNode('config/departments/${id}')">&times;</button>
                    </div>
                </div>`;
                dSelect.innerHTML += `<option value="${id}">${name.toUpperCase()}</option>`;
            });
            dSelect.value = currentDepVal;
            populateBuilderMatSelect();
        };

        window.addSimpleItem = (node, inputId) => {
            const val = document.getElementById(inputId).value.trim();
            if(!val) return;
            push(ref(db, `db_v15/config/${node}`), val);
            document.getElementById(inputId).value = '';
        };

        window.editSimpleItem = (node, id, oldVal) => {
            const newVal = prompt("Yeni ismi girin:", oldVal);
            if(newVal && newVal.trim() !== "" && newVal !== oldVal) {
                set(ref(db, `db_v15/config/${node}/${id}`), newVal.trim());
            }
        };

        window.deleteDbNode = (path) => {
            if(confirm("Silmek istediğinize emin misiniz?")) remove(ref(db, `db_v15/${path}`));
        };

        // --- MATERYAL DÜZENLEYİCİ ---
        function populateBuilderMatSelect() {
            const sel = document.getElementById('builderMatSelect');
            const currentVal = editingMatId || 'new';
            sel.innerHTML = '<option value="new">✨ SIFIRDAN YENİ ÜRÜN YARAT</option>';
            Object.entries(dbData.materials).forEach(([id, mat]) => {
                sel.innerHTML += `<option value="${id}">✏️ DÜZENLE: ${mat.name.toUpperCase()}</option>`;
            });
            sel.value = currentVal;
            validateField(sel);
        }

        window.loadMaterialForEdit = () => {
            const val = document.getElementById('builderMatSelect').value;
            validateField(document.getElementById('builderMatSelect'));
            if (val === 'new') {
                editingMatId = null;
                document.getElementById('builderDepSelect').value = '';
                document.getElementById('builderMatName').value = '';
                tempAttributes = [];
                document.getElementById('btnSaveMat').innerText = '✅ YENİ MALZEMEYİ KAYDET';
                document.getElementById('btnDeleteMat').style.display = 'none';
            } else {
                editingMatId = val;
                const mat = dbData.materials[val];
                document.getElementById('builderDepSelect').value = mat.depId;
                document.getElementById('builderMatName').value = mat.name;
                tempAttributes = mat.attributes ? JSON.parse(JSON.stringify(mat.attributes)) : [];
                document.getElementById('btnSaveMat').innerText = '🔄 DEĞİŞİKLİKLERİ GÜNCELLE';
                document.getElementById('btnDeleteMat').style.display = 'block';
            }
            validateField(document.getElementById('builderDepSelect'));
            renderTempAttributes();
        };

        window.addTempAttribute = () => {
            const name = document.getElementById('builderAttrName').value.trim();
            if(!name) return;
            tempAttributes.push({ name: name, options: [] });
            document.getElementById('builderAttrName').value = '';
            renderTempAttributes();
        };

        window.updateTempAttrName = (idx, val) => { if(val.trim()) tempAttributes[idx].name = val.trim(); };
        window.removeTempAttr = (index) => { tempAttributes.splice(index, 1); renderTempAttributes(); };

        window.addTempOption = (attrIndex) => {
            const val = document.getElementById(`optInput_${attrIndex}`).value.trim();
            if(!val) return;
            if(!tempAttributes[attrIndex].options) tempAttributes[attrIndex].options = [];
            if(!tempAttributes[attrIndex].options.includes(val)) tempAttributes[attrIndex].options.push(val);
            document.getElementById(`optInput_${attrIndex}`).value = '';
            renderTempAttributes();
        };

        window.editTempOption = (attrIndex, optIndex, oldVal) => {
            const newVal = prompt("Seçeneği düzenleyin:", oldVal);
            if(newVal && newVal.trim() !== "" && newVal !== oldVal) {
                tempAttributes[attrIndex].options[optIndex] = newVal.trim();
                renderTempAttributes();
            }
        };

        window.removeTempOption = (attrIndex, optIndex) => { tempAttributes[attrIndex].options.splice(optIndex, 1); renderTempAttributes(); };

        function renderTempAttributes() {
            const cont = document.getElementById('builderAttrContainer');
            cont.innerHTML = '';
            tempAttributes.forEach((attr, i) => {
                let optsArray = attr.options || [];
                let pills = optsArray.map((opt, j) => `
                <div class="pill">${opt} 
                    <div class="pill-actions">
                        <button class="pill-action-btn edit" onclick="editTempOption(${i}, ${j}, '${opt}')">✏️</button>
                        <button class="pill-action-btn delete" onclick="removeTempOption(${i}, ${j})">&times;</button>
                    </div>
                </div>`).join('');

                cont.innerHTML += `
                    <div class="attr-builder-box">
                        <input type="text" class="attr-title-input" value="${attr.name}" onchange="updateTempAttrName(${i}, this.value)">
                        <button class="btn-remove-attr" onclick="removeTempAttr(${i})">&times;</button>
                        <div class="input-group" style="margin-bottom:10px;">
                            <input type="text" id="optInput_${i}" placeholder="Seçenek Ekle (Örn: Mavi)">
                            <button class="btn-add" onclick="addTempOption(${i})">Seçenek Ekle</button>
                        </div>
                        <div class="pill-container">${pills}</div>
                    </div>
                `;
            });
        }

        window.saveNewMaterial = () => {
            const depId = document.getElementById('builderDepSelect').value;
            const matName = document.getElementById('builderMatName').value.trim();
            if(!depId || !matName) return alert("Lütfen Bölüm seçin ve Malzeme adı yazın!");

            const matData = { depId: depId, name: matName, attributes: tempAttributes };
            if (editingMatId) {
                set(ref(db, `db_v15/config/materials/${editingMatId}`), matData);
                alert("Malzeme güncellendi!");
            } else {
                push(ref(db, 'db_v15/config/materials'), matData);
                alert("Yeni malzeme yaratıldı!");
            }

            document.getElementById('builderMatSelect').value = 'new';
            loadMaterialForEdit();
        };

        window.deleteMaterial = () => {
            if(!editingMatId) return;
            if(confirm("DİKKAT: Bu malzemeyi ve tüm stok geçmişini tamamen silmek istediğinize emin misiniz?")) {
                remove(ref(db, `db_v15/config/materials/${editingMatId}`));
                remove(ref(db, `db_v15/stock/${editingMatId}`));
                document.getElementById('builderMatSelect').value = 'new';
                loadMaterialForEdit();
                alert("Malzeme silindi.");
            }
        };

        // --- YENİ İŞLEM MODALI (AKILLI FORM & YENİ EKLE) ---
        window.openActionModal = () => {
            if(!activeTabId) return alert("Önce bölüm ayarlamalısınız.");
            document.getElementById('actionModalTitle').innerText = `📦 Yeni İşlem - ${dbData.departments[activeTabId]}`;
            
            const uSel = document.getElementById('actionUserSelect');
            uSel.innerHTML = '<option value="">-- Personel Seçin --</option>';
            Object.values(dbData.users).forEach(u => uSel.innerHTML += `<option value="${u}">${u}</option>`);
            validateField(uSel);

            const mSel = document.getElementById('actionMatSelect');
            mSel.innerHTML = '<option value="">-- Malzeme Seçin --</option>';
            Object.entries(dbData.materials).filter(([_, m]) => m.depId === activeTabId).forEach(([id, m]) => {
                mSel.innerHTML += `<option value="${id}">${m.name.toUpperCase()}</option>`;
            });
            validateField(mSel);

            document.getElementById('actionDynamicArea').innerHTML = '';
            document.getElementById('actionQty').value = 1;
            document.getElementById('actionNote').value = '';
            document.getElementById('actionNote').classList.remove('filled-field');
            openModal('actionModal');
        };

        window.renderActionAttributes = () => {
            const matId = document.getElementById('actionMatSelect').value;
            const area = document.getElementById('actionDynamicArea');
            area.innerHTML = '';
            if(!matId || !dbData.materials[matId].attributes) return;

            dbData.materials[matId].attributes.forEach((attr, idx) => {
                let opts = (attr.options || []).map(o => `<option value="${o}">${o}</option>`).join('');
                area.innerHTML += `
                    <label class="form-label">👉 ${attr.name}</label>
                    <select id="dynAttr_${idx}" class="custom-select empty-field" onchange="toggleNewAttrInput(${idx}, this)">
                        <option value="">-- Seçiniz --</option>
                        ${opts}
                        <option value="__NEW__">➕ Yeni Ekle (Elle Yaz)...</option>
                    </select>
                    <input type="text" id="dynAttrNew_${idx}" class="dyn-new-input empty-field" placeholder="Yazın ve işleme devam edin..." oninput="validateNewInput(this)">
                `;
            });
        };

        window.toggleNewAttrInput = (idx, selEl) => {
            const inp = document.getElementById(`dynAttrNew_${idx}`);
            if(selEl.value === '__NEW__') {
                inp.style.display = 'block';
                inp.focus();
                selEl.classList.remove('empty-field');
                selEl.classList.add('filled-field');
            } else {
                inp.style.display = 'none';
                validateField(selEl);
            }
        };

        window.processTransaction = (type) => {
            const user = document.getElementById('actionUserSelect').value;
            const matId = document.getElementById('actionMatSelect').value;
            const qty = parseInt(document.getElementById('actionQty').value);
            const note = document.getElementById('actionNote').value.trim();

            if(!user || !matId || isNaN(qty) || qty <= 0) return alert("Personel, Malzeme ve Miktar zorunludur!");

            const mat = JSON.parse(JSON.stringify(dbData.materials[matId])); 
            let variantParts = [];
            let missingAttr = false;
            let materialUpdated = false;

            if (mat.attributes) {
                mat.attributes.forEach((attr, idx) => {
                    let val = document.getElementById(`dynAttr_${idx}`).value;
                    if(val === '__NEW__') {
                        val = document.getElementById(`dynAttrNew_${idx}`).value.trim();
                        if(!val) {
                            missingAttr = true;
                        } else {
                            if(!attr.options) attr.options = [];
                            if(!attr.options.some(o => o.toLowerCase() === val.toLowerCase())) {
                                attr.options.push(val);
                                materialUpdated = true;
                            }
                        }
                    } else if(!val) {
                        missingAttr = true;
                    }
                    if(val) variantParts.push(val);
                });
            }

            if(missingAttr) return alert("Lütfen malzemenin tüm alt niteliklerini seçin veya yazın!");

            const variantKey = variantParts.length > 0 ? variantParts.join(' | ') : 'Standart';
            confirmTx(user, matId, mat.name, variantKey, type, qty, 'main', materialUpdated ? mat : null, note);
        };

        // --- ONAY VE LOG ---
        window.confirmTx = (user, matId, matName, variant, type, qty, source, updatedMatObj = null, note = "") => {
            const islem = type === 'in' ? `<span class="highlight success">STOĞA EKLİYOR</span>` : `<span class="highlight danger">STOKTAN DÜŞÜYOR</span>`;
            let vHtml = variant !== 'Standart' ? variant.split(' | ').map(v => `<span class="highlight">${v}</span>`).join(' ') + '<br>' : '';
            let noteHtml = note ? `<br><br><span style="font-size:18px; color:var(--text-muted); border:2px dashed var(--border); padding:10px; border-radius:10px; display:inline-block;">Not: ${note}</span>` : '';

            document.getElementById('confirmText').innerHTML = `
                <span class="highlight">${user}</span> adlı personel,<br><br>
                ${vHtml}
                <span class="highlight">${qty} BİRİM</span> 
                <span class="highlight">${matName.toUpperCase()}</span> malzemeyi ${islem}. 
                ${noteHtml}
                <br><br><strong>Onaylıyor musunuz?</strong>
            `;
            pendingTx = { user, matId, matName, variant, type, qty, source, updatedMatObj, note };
            openModal('confirmModal');
        };

        document.getElementById('executeBtn').onclick = () => {
            if(!pendingTx) return;
            const { user, matId, matName, variant, type, qty, source, updatedMatObj, note } = pendingTx;
            const safeVar = variant.replace(/\./g, '_');

            const currentObj = (dbStock[matId] && dbStock[matId][safeVar]) || { qty: 0, note: "" };
            const currentQty = currentObj.qty || 0;
            const newQty = type === 'in' ? currentQty + qty : currentQty - qty;

            if (type === 'out' && newQty < 0) {
                if(!confirm("Dikkat: Stok eksiye düşecek. Devam edilsin mi?")) { closeModal('confirmModal'); return; }
            }

            // Yeni özellik eklendiyse DB'de malzeme yapısını güncelle
            if(updatedMatObj) { set(ref(db, `db_v15/config/materials/${matId}`), updatedMatObj); }

            // Stoku (Adet ve Son Not olarak) güncelle
            set(ref(db, `db_v15/stock/${matId}/${safeVar}`), { qty: newQty, note: note });

            // Geçmişe Log At
            const now = new Date();
            const timeStr = now.toLocaleDateString('tr-TR') + " " + now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
            
            push(ref(db, `db_v15/logs`), {
                time: timeStr, user: user,
                detail: `<b>${matName.toUpperCase()}</b> <br><span class="log-detail">${variant} | ${qty} Birim</span>`,
                note: note,
                status: type === 'in' ? 'Giriş' : 'Çıkış'
            });

            closeModal('confirmModal');
            if(source === 'main') closeModal('actionModal');
            else renderDetailModal(matId); 
            pendingTx = null;
        };

        // --- DETAYLI STOK MODALI ---
        window.openDetailModal = (matId) => {
            currentDetailMatId = matId;
            renderDetailModal(matId);
            openModal('detailModal');
        };

        window.jumpToActionModal = () => {
            closeModal('detailModal');
            openActionModal();
            document.getElementById('actionMatSelect').value = currentDetailMatId;
            validateField(document.getElementById('actionMatSelect'));
            renderActionAttributes();
        };

        window.renderDetailModal = function(matId) {
            const mat = dbData.materials[matId];
            if(!mat) return;

            document.getElementById('detailModalTitle').innerText = `📦 ${mat.name.toUpperCase()}`;
            
            const qUserSel = document.getElementById('quickUserSelect');
            const qUserVal = qUserSel.value;
            qUserSel.innerHTML = '<option value="">-- Hızlı İşlem İçin Personel Seçin --</option>';
            Object.values(dbData.users).forEach(u => qUserSel.innerHTML += `<option value="${u}">${u}</option>`);
            if(qUserVal) { qUserSel.value = qUserVal; validateField(qUserSel); } else { validateField(qUserSel); }

            const thead = document.getElementById('detailTableHead');
            const tbody = document.querySelector('#detailTable tbody');
            tbody.innerHTML = '';
            
            let tHeadHtml = '<tr>';
            if (mat.attributes && mat.attributes.length > 0) {
                mat.attributes.forEach(a => tHeadHtml += `<th>${a.name}</th>`);
            } else { tHeadHtml += `<th>Detay</th>`; }
            tHeadHtml += `<th>Not / Detay</th><th style="text-align:center;">Stok</th><th style="text-align:center;">İşlem</th></tr>`;
            thead.innerHTML = tHeadHtml;

            let hasItems = false;
            if (dbStock[matId]) {
                Object.entries(dbStock[matId]).forEach(([key, stockData], idx) => {
                    // stockData is { qty: X, note: Y }
                    const qty = stockData.qty || 0;
                    const note = stockData.note || '';

                    if (qty !== 0) {
                        hasItems = true;
                        const vKey = key.replace(/_/g, '.');
                        const p = vKey.split(' | ');
                        const encodedVariant = btoa(unescape(encodeURIComponent(vKey)));
                        
                        let tdHtml = '';
                        if (mat.attributes && mat.attributes.length > 0) {
                            p.forEach(val => tdHtml += `<td><strong>${val}</strong></td>`);
                        } else {
                            tdHtml += `<td><strong>${vKey}</strong></td>`;
                        }

                        tbody.innerHTML += `
                            <tr>
                                ${tdHtml}
                                <td style="color:var(--text-muted); font-size:14px; max-width:150px;">${note}</td>
                                <td style="text-align:center; font-size:36px; font-weight:900; color:var(--primary);">${qty}</td>
                                <td>
                                    <div class="quick-action-cell">
                                        <input type="text" id="row_note_${idx}" class="row-note-input" placeholder="İşlem notu (Opsiyonel)">
                                        <button class="quick-btn out" onclick="quickAction('${matId}', '${encodedVariant}', 'out', 'row_${idx}', 'row_note_${idx}')">Düş</button>
                                        <div class="row-qty-control"><input type="number" id="row_${idx}" value="1" min="1" class="row-qty-input"></div>
                                        <button class="quick-btn in" onclick="quickAction('${matId}', '${encodedVariant}', 'in', 'row_${idx}', 'row_note_${idx}')">Ekle</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }
                });
            }

            const qUserCont = document.getElementById('quickUserContainer');
            if (!hasItems) {
                qUserCont.style.display = 'none'; thead.style.display = 'none';
                tbody.innerHTML = `<tr><td colspan="10" class="empty-state">
                    <div class="empty-state-icon">📭</div><div class="empty-state-text">Stok kaydı yok.</div>
                    <button class="btn-top btn-action" style="margin:0 auto;" onclick="jumpToActionModal()">➕ Yeni İşlem Ekle</button>
                </td></tr>`;
            } else {
                qUserCont.style.display = 'block'; thead.style.display = 'table-header-group';
            }
        };

        window.quickAction = (matId, encodedVariant, type, qtyInputId, noteInputId) => {
            const user = document.getElementById('quickUserSelect').value;
            const qty = parseInt(document.getElementById(qtyInputId).value);
            const note = document.getElementById(noteInputId).value.trim();
            if(!user) return alert("Lütfen Personel seçin!");
            if(isNaN(qty) || qty <= 0) return;
            const variantKey = decodeURIComponent(escape(atob(encodedVariant)));
            const matName = dbData.materials[matId].name;
            confirmTx(user, matId, matName, variantKey, type, qty, 'detail', null, note);
        };

        // --- GEÇMİŞ ---
        window.filterLogs = () => {
            const search = document.getElementById('logSearchInput').value.toLowerCase();
            const dateF = document.getElementById('logDateFilter').value;
            const customDate = document.getElementById('logCustomDate').value; // Format: YYYY-MM-DD
            
            let customDateStr = "";
            if(customDate) {
                const [y, m, d] = customDate.split('-');
                customDateStr = `${d}.${m}.${y}`;
            }

            const tbody = document.querySelector('#logTable tbody');
            tbody.innerHTML = '';
            
            const now = new Date();
            const todayStr = now.toLocaleDateString('tr-TR'); const monthStr = todayStr.substring(3); const yearStr = todayStr.substring(6); 

            dbLogs.forEach(log => {
                const logDate = log.time.split(' ')[0];
                
                // Tarih Filtreleri
                if(customDateStr && logDate !== customDateStr) return;
                if(!customDateStr) {
                    if(dateF === 'today' && logDate !== todayStr) return;
                    if(dateF === 'month' && !logDate.endsWith(monthStr)) return;
                    if(dateF === 'year' && !logDate.endsWith(yearStr)) return;
                }

                // Arama Filtresi
                const plainRow = (log.user + ' ' + log.detail.replace(/<[^>]*>?/gm, '') + ' ' + (log.note || '')).toLowerCase();
                if(!plainRow.includes(search)) return;

                const statusClass = log.status === 'Giriş' ? 'status-in' : 'status-out';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${log.time.split(' ')[0]}</strong><br><span style="color:var(--text-muted); font-size:13px; font-weight:700;">${log.time.split(' ')[1]}</span></td>
                        <td style="font-weight:900; font-size:18px; color:var(--text-dark);">${log.user}</td>
                        <td style="font-size:17px;">${log.detail}</td>
                        <td style="color:var(--text-muted); font-size:14px; max-width:200px;">${log.note || '-'}</td>
                        <td style="text-align:right;"><span class="status-badge ${statusClass}">${log.status}</span></td>
                    </tr>
                `;
            });

            if(tbody.innerHTML === '') tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Bulunamadı.</td></tr>`;
        };

        window.changeQty = (id, amt) => { const el = document.getElementById(id); let v = parseInt(el.value)+amt; el.value = v < 1 ? 1 : v; };
        window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; if(id === 'historyModal') filterLogs(); if(id === 'settingsModal') loadMaterialForEdit(); };
        window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; if(id === 'detailModal') currentDetailMatId = null; };

    </script>
</body>
</html>
